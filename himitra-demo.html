<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HIMITRA – App demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF0F3; --surf:#FFFFFF; --surf2:#F2F6F8; --ink:#12242D; --mut:#586A73; --line:#D8E1E6;
  --blue:#2B6CB0; --sky:#2D9CDB; --red:#D64545; --sos:#E02F2F; --green:#2F9E63; --yellow:#EDAE1F;
  --pri:#1D5C8E; --on-pri:#fff;
  --map-land:#E3EBE5; --map-cont:#BFCEC4; --map-river:#7DB3D6; --map-road:#A3AFB4; --map-txt:#3E4F57; --map-pin:#12242D;
  --amber-bg:#FFF3D6; --amber-ink:#6B4A00; --ok-bg:#E2F4EA; --ok-ink:#175C38; --bad-bg:#FBE4E2; --bad-ink:#8A1F1A;
  --shadow:0 10px 30px rgba(10,30,40,.18);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B161B; --surf:#13232A; --surf2:#1A2E37; --ink:#E8F0F3; --mut:#94A8B0; --line:#25393F;
    --blue:#5B9BE0; --sky:#52B4EA; --red:#F06666; --sos:#F04848; --green:#4CBF85; --yellow:#F3BD3F;
    --pri:#5AA6E3; --on-pri:#08161D;
    --map-land:#10212A; --map-cont:#1F3843; --map-river:#3F7EA6; --map-road:#4C6068; --map-txt:#A9BCC3; --map-pin:#E8F0F3;
    --amber-bg:#3A2E0E; --amber-ink:#F6D77C; --ok-bg:#12352380; --ok-ink:#8EE0B4; --bad-bg:#40191A; --bad-ink:#F5A3A0;
    --shadow:0 10px 30px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#0B161B; --surf:#13232A; --surf2:#1A2E37; --ink:#E8F0F3; --mut:#94A8B0; --line:#25393F;
  --blue:#5B9BE0; --sky:#52B4EA; --red:#F06666; --sos:#F04848; --green:#4CBF85; --yellow:#F3BD3F;
  --pri:#5AA6E3; --on-pri:#08161D;
  --map-land:#10212A; --map-cont:#1F3843; --map-river:#3F7EA6; --map-road:#4C6068; --map-txt:#A9BCC3; --map-pin:#E8F0F3;
  --amber-bg:#3A2E0E; --amber-ink:#F6D77C; --ok-bg:#12352380; --ok-ink:#8EE0B4; --bad-bg:#40191A; --bad-ink:#F5A3A0;
  --shadow:0 10px 30px rgba(0,0,0,.5);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 'Noto Sans','Noto Sans Devanagari','Noto Sans Bengali',system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh;overflow-x:hidden}
h1,h2,h3,.disp{font-family:'Bricolage Grotesque','Noto Sans Devanagari','Noto Sans Bengali','Noto Sans',system-ui,sans-serif;font-weight:700;line-height:1.15}
:lang(en) h1,:lang(en) h2,:lang(en) .disp{letter-spacing:-.015em}
h1{font-size:clamp(30px,6vw,46px)} h2{font-size:22px} h3{font-size:17px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:8px}
.ic{flex:none;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surf);border-bottom:1px solid var(--line)}
.strip{display:flex;height:5px}.strip i{flex:1}
.bar{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:8px 14px;max-width:1240px;margin:0 auto}
.brand{display:flex;align-items:center;gap:8px;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:20px;color:var(--ink)}
.brand svg{color:var(--pri)}
.seg{display:flex;background:var(--surf2);border:1px solid var(--line);border-radius:14px;padding:3px;order:3;width:100%}
.seg button{flex:1;padding:8px 10px;border-radius:11px;font-weight:600;font-size:14px;color:var(--mut);min-height:40px;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.tools{margin-left:auto;display:flex;gap:8px;align-items:center}
.pill-btn{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surf);border-radius:999px;padding:0 12px;min-height:40px;font-weight:600;font-size:14px}
.pill-btn[aria-pressed=true]{background:var(--amber-bg);color:var(--amber-ink);border-color:transparent}
.lang{appearance:none;background:var(--surf);border:1px solid var(--line);border-radius:999px;padding:0 14px;min-height:40px;font-weight:600;cursor:pointer}
@media(min-width:760px){.seg{order:0;width:auto;margin-left:12px}.seg button{padding:8px 16px}}

/* shell */
.shell{max-width:1240px;margin:0 auto;display:block}
main{padding:16px 14px calc(110px + env(safe-area-inset-bottom,0px));min-width:0}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surf);border-top:1px solid var(--line);display:flex;padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px))}
.nv{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 6px;font-size:12px;font-weight:500;color:var(--mut);position:relative;min-height:54px;border-radius:12px}
.nv[aria-current=page]{color:var(--ink);font-weight:700}
.nv[aria-current=page] .ic{color:var(--c)}
.nv[aria-current=page]::before{content:"";position:absolute;top:-5px;left:24%;right:24%;height:4px;border-radius:0 0 4px 4px;background:var(--c)}
@media(min-width:900px){
  .shell{display:grid;grid-template-columns:210px minmax(0,1fr);gap:8px;align-items:start}
  .nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 96px);flex-direction:column;border:0;background:none;padding:22px 0 0 14px;gap:4px;bottom:auto}
  .nv{flex:none;flex-direction:row;gap:12px;padding:0 14px;font-size:15px;justify-content:flex-start;min-height:48px}
  .nv[aria-current=page]{background:var(--surf);box-shadow:inset 0 0 0 1px var(--line)}
  .nv[aria-current=page]::before{top:12px;bottom:12px;left:-1px;right:auto;width:4px;height:auto;border-radius:0 4px 4px 0}
  main{padding:22px 22px 60px}
}

/* generic */
.card{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:16px}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1}
.mut{color:var(--mut)}.sm{font-size:13px}.b{font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surf);border-radius:999px;padding:0 14px;min-height:40px;font-weight:500}
button.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:8px;padding:3px 8px;background:var(--surf2);color:var(--mut)}
.tag.ok{background:var(--ok-bg);color:var(--ok-ink)}.tag.warn{background:var(--amber-bg);color:var(--amber-ink)}.tag.bad{background:var(--bad-bg);color:var(--bad-ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:14px;background:var(--pri);color:var(--on-pri);font-weight:700}
.btn.alt{background:var(--surf2);color:var(--ink);border:1px solid var(--line)}
.btn.block{width:100%}.btn.sm{min-height:40px;padding:0 14px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:default}
.sec{margin-top:26px}.sec>h2{margin-bottom:12px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.stepper{display:flex;align-items:center;gap:6px}.stepper button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surf);font-size:20px;font-weight:600}.stepper b{min-width:28px;text-align:center;font-size:18px}
.note{font-size:12.5px;color:var(--mut);display:flex;gap:6px;align-items:center}

/* hero */
.hero{position:relative;border-radius:28px 28px 28px 8px;overflow:hidden;min-height:250px;background:linear-gradient(180deg,#17385A 0%,#4A6F97 46%,#F1B98B 100%);color:#fff}
.hero svg.art{position:absolute;inset:0;width:100%;height:100%}
.hero-t{position:relative;padding:22px 22px 0;max-width:560px}
.hero-t p{opacity:.92;font-size:17px;margin-top:6px}
.flag{transform-box:fill-box;transform-origin:50% 0;animation:sway 3.6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:skewY(-4deg)}50%{transform:skewY(4deg)}}
@media(prefers-reduced-motion:reduce){.flag,.pulse,.fab::after,.wave i{animation:none!important}}
@media(min-width:900px){.hero{min-height:290px}.hero-t{padding:30px 34px}}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
@media(min-width:760px){.tiles{grid-template-columns:repeat(6,1fr)}}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:14px;background:var(--surf);border:1px solid var(--line);border-radius:20px 20px 20px 6px;padding:14px;text-align:left;min-height:96px;font-weight:600;font-size:14px;line-height:1.25}
.tile .dot{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.tile:hover{border-color:var(--c)}

/* planner */
.planner{display:grid;gap:18px}
.field>label,.field>.lab{display:block;font-weight:600;margin-bottom:8px}
.two{display:grid;gap:18px}
@media(min-width:760px){.two{grid-template-columns:1fr 1fr}}
.segb{display:flex;background:var(--surf2);border:1px solid var(--line);border-radius:13px;padding:3px}
.segb button{flex:1;min-height:40px;border-radius:10px;font-weight:600;font-size:14px;color:var(--mut)}
.segb button[aria-pressed=true]{background:var(--surf);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.trip{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.trip .arrow{color:var(--mut)}
.days{display:grid;gap:14px}
.day{display:grid;grid-template-columns:54px 1fr;gap:12px}
.dbadge{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:14px;background:var(--ink);color:var(--bg);height:54px;line-height:1.05}
.dbadge b{font-family:'Bricolage Grotesque',sans-serif;font-size:22px}.dbadge span{font-size:11px}
.slots{display:grid;gap:8px}
.slot{display:flex;align-items:center;gap:12px;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-height:54px}
.slot .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surf2);color:var(--pri);flex:none}
.slot a,.slot button.lnk{color:var(--pri);font-weight:600;font-size:13px;text-decoration:underline;text-underline-offset:3px;min-height:36px}
.est{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.est b{font-family:'Bricolage Grotesque',sans-serif;font-size:32px}

/* map */
.mapbox{border-radius:20px;overflow:hidden;border:1px solid var(--line);background:var(--map-land);position:relative}
.mapbox svg{display:block;width:100%;height:100%}
.route{display:grid;gap:16px}
@media(min-width:900px){.route{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);align-items:start}.route .mapbox{position:sticky;top:calc(env(safe-area-inset-top,0px) + 100px)}}
.rmap{height:min(66vh,560px);min-height:340px}
.rcard{display:grid;gap:8px;text-align:left;width:100%;background:var(--surf);border:1.5px solid var(--line);border-radius:18px;padding:14px}
.rcard[aria-pressed=true]{border-color:var(--pri);box-shadow:0 0 0 1px var(--pri)}
.rcard .big{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:26px}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[type=range]{width:100%;accent-color:var(--pri);height:36px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;font-size:14px}
.alert.warn{background:var(--amber-bg);color:var(--amber-ink)}.alert.ok{background:var(--ok-bg);color:var(--ok-ink)}
.pulse{animation:pulse 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{transform:scale(.6);opacity:.7}100%{transform:scale(2.2);opacity:0}}

/* cards with scenes */
.lcard{background:var(--surf);border:1px solid var(--line);border-radius:22px 22px 22px 8px;overflow:hidden;display:flex;flex-direction:column}
.lcard .scene{display:block;width:100%;height:132px}
.lcard .body{padding:14px;display:grid;gap:10px;flex:1}
.price{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:22px}
.avatar{width:54px;height:54px;border-radius:18px 18px 18px 6px;display:grid;place-items:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:20px;color:#fff;flex:none}
.trk{border:1px solid var(--line);border-radius:18px;background:var(--surf);overflow:hidden}
.trk .mapbox{border:0;border-radius:0;height:190px}
.trk .in{padding:12px 14px;display:grid;gap:10px}
.bar-prog{height:8px;border-radius:8px;background:var(--surf2);overflow:hidden}.bar-prog i{display:block;height:100%;background:var(--green);border-radius:8px;transition:width .8s linear}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:12px}
.stat b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:24px;font-weight:800;line-height:1.1}

/* permits */
.areas{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.area{display:flex;gap:12px;align-items:center;text-align:left;border:1.5px solid var(--line);border-radius:16px;padding:12px;background:var(--surf);min-height:64px}
.area[aria-pressed=true]{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 10%,var(--surf))}
.area .ck{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;color:transparent}
.area[aria-pressed=true] .ck{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.agency{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:16px;padding:12px;background:var(--surf)}
.agency[aria-pressed=true]{border-color:var(--pri);box-shadow:0 0 0 1px var(--pri)}
.steps{display:grid;gap:0}
.st{display:flex;gap:12px;align-items:center;padding:10px 0;position:relative;color:var(--mut)}
.st .d{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;background:var(--surf)}
.st.on{color:var(--ink);font-weight:600}.st.on .d{background:var(--green);border-color:var(--green);color:#fff}
.st.cur .d{border-color:var(--pri)}
.pass{border-radius:24px 24px 24px 8px;overflow:hidden;background:var(--surf);border:1px solid var(--line)}
.pass .hd{background:linear-gradient(120deg,#17385A,#2B6CB0);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
.pass .bd{display:grid;grid-template-columns:1fr auto;gap:16px;padding:16px;align-items:center}
.qr{width:104px;height:104px;background:#fff;padding:6px;border-radius:10px;border:1px solid var(--line)}

/* SOS */
.fab{position:fixed;right:14px;bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:40;width:68px;height:68px;border-radius:50%;background:var(--sos);color:#fff;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:19px;box-shadow:0 8px 22px rgba(224,47,47,.5);display:grid;place-items:center}
.fab::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--sos);animation:pulse 2s ease-out infinite}
.fab:active{transform:scale(.95)}
@media(min-width:900px){.fab{bottom:28px;right:28px;width:74px;height:74px}}

/* overlay */
.ov{position:fixed;inset:0;z-index:60;background:rgba(6,16,22,.6);display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.ov[hidden]{display:none}
.sheet{width:100%;max-width:520px;max-height:96vh;overflow:auto;background:var(--surf);border-radius:26px 26px 0 0;box-shadow:var(--shadow);padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));animation:up .28s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media(min-width:760px){.ov{align-items:center}.sheet{border-radius:28px}}
.sheet.sos{background:linear-gradient(180deg,#5A1414,#2B0A0A);color:#fff}
.ring{position:relative;width:170px;height:170px;margin:8px auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:'Bricolage Grotesque',sans-serif;font-size:64px;font-weight:800}
.contact{display:flex;align-items:center;gap:10px;padding:8px 0;opacity:0;animation:fade .4s forwards}
@keyframes fade{to{opacity:1}}
.tick{width:24px;height:24px;border-radius:50%;background:var(--green);display:grid;place-items:center;color:#fff}
.sos .card{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.16)}
.sos .mut{color:rgba(255,255,255,.72)}

/* call */
.callhead{display:flex;align-items:center;gap:12px}
.wave{display:flex;gap:4px;align-items:center;height:34px}
.wave i{width:5px;border-radius:4px;background:var(--green);height:8px;animation:wv 1s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.15s}.wave i:nth-child(3){animation-delay:.3s}.wave i:nth-child(4){animation-delay:.45s}.wave i:nth-child(5){animation-delay:.6s}
@keyframes wv{0%,100%{height:8px}50%{height:30px}}
.caps{display:grid;gap:10px;margin:14px 0;max-height:46vh;overflow:auto;padding:2px}
.bub{max-width:88%;padding:10px 12px;border-radius:16px 16px 16px 4px;background:var(--surf2);border:1px solid var(--line);animation:up .25s ease-out}
.bub.me{justify-self:end;border-radius:16px 16px 4px 16px;background:color-mix(in srgb,var(--pri) 14%,var(--surf));border-color:transparent}
.bub .pr{font-size:16px;font-weight:500}
.bub .sc{display:flex;gap:8px;align-items:center;margin-top:6px;font-size:13px;color:var(--mut)}
.bub .sc button{margin-left:auto;color:var(--pri);min-width:36px;min-height:36px;display:grid;place-items:center}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(min-width:900px){#toast{bottom:32px}}
</style>
</head>
<body>
<div id="chrome"></div>
<div class="shell">
  <nav class="nav" id="nav" aria-label="Main"></nav>
  <main id="main"></main>
</div>
<button class="fab" id="fab" data-a="sos" aria-label="SOS">SOS</button>
<div id="ov" class="ov" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ============ i18n ============ */
const LI={en:0,hi:1,ne:2,bn:3};
const LANGS={en:'English',hi:'हिन्दी',ne:'नेपाली',bn:'বাংলা'};
const TTSL={en:'en-IN',hi:'hi-IN',ne:'ne-NP',bn:'bn-IN'};
const D={
tagline:["Smart & safe travel for the Himalayas","हिमालय के लिए स्मार्ट और सुरक्षित यात्रा","हिमालयका लागि स्मार्ट र सुरक्षित यात्रा","হিমালয়ের জন্য স্মার্ট ও নিরাপদ ভ্রমণ"],
nav_home:["Home","होम","गृहपृष्ठ","হোম"],

function smooth(pts){
  if(pts.length<3)return 'M'+pts.map(p=>p.join(' ')).join('L');
  let d='M'+pts[0].join(' ');
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6],c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];
    d+=`C${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${p2[0]} ${p2[1]}`;
  }
  return d;
}
function blob(cx,cy,r,s){let d='';for(let i=0;i<=48;i++){const a=i/48*Math.PI*2,rr=r*(1+.16*Math.sin(3*a+s)+.09*Math.sin(5*a+2*s)+.05*Math.sin(9*a+s*3));d+=(i?'L':'M')+(cx+rr*Math.cos(a)).toFixed(1)+' '+(cy+rr*Math.sin(a)*1.15).toFixed(1)}return d+'Z'}

  let r=i*7+3;const rnd=()=>(r=(r*9301+49297)%233280)/233280;
  let m1='M0 140',x=0;while(x<300){x+=30+rnd()*30;m1+=`L${x.toFixed(0)} ${(50+rnd()*46).toFixed(0)}L${(x+22).toFixed(0)} ${(80+rnd()*30).toFixed(0)}`}
  const g='sg'+i;

/* route engine */
const rainAt=h=>Math.min(1,.1+.9*Math.exp(-Math.pow(h-15.5,2)/(2*2.4*2.4)));
function evalRoute(r,dep){
  let tt=dep,tot=0,maxR=0;const segs=[];
  r.segs.forEach(s=>{const mid=tt+(s.km/r.spd)/2,rn=rainAt(mid),risk=Math.min(1,s.base+rn*s.sens*.75),hrs=s.km/r.spd*(1+.5*rn*s.sens);segs.push({...s,risk,hrs,rn});tt+=hrs;tot+=hrs;maxR=Math.max(maxR,risk)});
  return {segs,total:tot,arrive:dep+tot,maxR,score:tot+4*maxR,km:r.segs.reduce((a,s)=>a+s.km,0)};
}
const riskCls=x=>x<.25?'low':x<.5?'med':'high';
const riskCol=x=>x<.25?'var(--green)':x<.5?'var(--yellow)':'var(--red)';
const riskTag=x=>x<.25?'ok':x<.5?'warn':'bad';
function fmtT(h){h=((h%24)+24)%24;let hh=Math.floor(h),mm=Math.round((h-hh)*60);if(mm===60){hh++;mm=0}const ap=hh>=12?'pm':'am';const h12=hh%12||12;return `${h12}:${String(mm).padStart(2,'0')} ${ap}`}
function fmtD(x){const hh=Math.floor(x),mm=Math.round((x-hh)*60);return `${hh}${t('h')} ${mm}${t('m')}`}
function aiPick(dep){const a=evalRoute(ROUTES.A,dep),b=evalRoute(ROUTES.B,dep);return a.score<=b.score?'A':'B'}
function bestDep(){let best=5,bs=1e9;for(let h=5;h<=14;h+=.5){const s=Math.min(evalRoute(ROUTES.A,h).score,evalRoute(ROUTES.B,h).score);if(s<bs){bs=s;best=h}}return best}
function vRoute(){

   <div style="display:grid;gap:14px">
    <div class="card"><div class="row"><label for="dep" class="b">${t('leave_at')}</label><span class="sp"></span><b class="disp" style="font-size:22px" id="dep-l"></b></div>

function chosen(){return S.pick==='auto'?aiPick(S.dep):S.pick}
function updateRoute(){
  const box=$('#rt-map');if(!box)return;
  stopDrive(true);
  const evA=evalRoute(ROUTES.A,S.dep),evB=evalRoute(ROUTES.B,S.dep),ai=aiPick(S.dep),ch=chosen();
  const EV={A:evA,B:evB};
  $('#dep-l').textContent=fmtT(S.dep);
  // map
  const rain=rainAt(S.dep+2.5);
  let svg=`<svg viewBox="110 370 380 600" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Route map">${baseMap()}`;
  if(S.layers.rain)svg+=`<defs><pattern id="rp" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(18)"><line x1="0" y1="0" x2="0" y2="9" stroke="var(--map-river)" stroke-width="1.6" opacity=".9"/><animateTransform attributeName="patternTransform" type="translate" additive="sum" from="0 0" to="0 14" dur=".7s" repeatCount="indefinite"/></pattern></defs><rect x="-900" y="-900" width="2400" height="2800" fill="url(#rp)" opacity="${(rain*.55).toFixed(2)}" pointer-events="none"/><rect x="-900" y="-900" width="2400" height="2800" fill="#4B6A80" opacity="${(rain*.16).toFixed(2)}" pointer-events="none"/>`;
  const other=ch==='A'?'B':'A';
  svg+=`<path d="${smooth(ROUTES[other].pts)}" fill="none" stroke="var(--mut)" stroke-width="3.5" stroke-dasharray="7 7" stroke-linecap="round" opacity=".65"/>`;
  const R=ROUTES[ch];
  R.segs.forEach((s,i)=>{const pts=R.pts.slice(s.a,s.b+1);const c=S.layers.risk?riskCol(EV[ch].segs[i].risk):'var(--blue)';svg+=`<path d="${smooth(pts)}" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity=".9"/><path d="${smooth(pts)}" fill="none" stroke="${c}" stroke-width="6" stroke-linecap="round"/>`});
  svg+=`<path id="rt-full" d="${smooth(R.pts)}" fill="none" stroke="none"/>`;
  svg+=`<g id="veh" transform="translate(${R.pts[0][0]},${R.pts[0][1]})"><circle r="9" fill="var(--blue)" class="pulse" opacity=".5"/><circle r="6.5" fill="var(--blue)" stroke="#fff" stroke-width="2.5"/></g></svg>`;
  box.innerHTML=svg;
  // cards
  const card=(id,label)=>{const e=EV[id],r=ROUTES[id];return `<button class="rcard" data-a="pickroute" data-v="${id}" aria-pressed="${ch===id}">
   <div class="row"><b>${label}</b><span class="mut sm">${r.n}</span><span class="sp"></span>${ai===id?`<span class="tag ok">${ic('spark',13)}${t('ai_pick')}</span>`:''}</div>
   <div class="rgrid"><div><div class="mut sm">${t('arrive')}</div><div class="big">${fmtT(e.arrive)}</div><div class="mut sm">${fmtD(e.total)} · ${e.km} ${t('km')}</div></div>
   <div><div class="mut sm">${t('risk')}</div><div style="margin-top:6px"><span class="tag ${riskTag(e.maxR)}">${t(riskCls(e.maxR))}</span></div><div class="bar-prog" style="margin-top:10px"><i style="width:${Math.round(e.maxR*100)}%;background:${riskCol(e.maxR)}"></i></div></div></div></button>`};
  $('#rt-cards').innerHTML=card('A',t('fastest'))+card('B',t('safest'));
  // alerts
  const alerts=[];EV[ch].segs.forEach(s=>{if(s.risk>=.5)alerts.push(`<div class="alert warn">${ic('alert',20)}<span>${t('al_rain',{s:s.n})}</span></div>`)});
  const bd=bestDep();
  alerts.push(`<div class="alert ${alerts.length?'warn':'ok'}">${ic(alerts.length?'clock':'check',20)}<span>${alerts.length?t('al_best',{h:fmtT(bd)}):t('al_ok')}</span></div>`);
  $('#rt-alerts').innerHTML=alerts.join('');
  $('#rt-elev').innerHTML=elevSVG(ch,EV[ch]);
  const km=EV[ch].km;$('#rt-prog').textContent=`${ROUTES[ch].n}: ${km} ${t('km')}, ${fmtD(EV[ch].total)}`;
}
function elevSVG(id,ev){
  const W=340,H=96,E=ELEV[id],tot=E[E.length-1][0],sx=k=>10+k/tot*(W-20),sy=e=>78-e/1700*62;
  const line=E.map((p,i)=>(i?'L':'M')+sx(p[0]).toFixed(1)+' '+sy(p[1]).toFixed(1)).join('');
  let strip='',acc=0;ev.segs.forEach(s=>{const x1=sx(acc/ev.km*tot),x2=sx((acc+s.km)/ev.km*tot);strip+=`<rect x="${x1.toFixed(1)}" y="86" width="${(x2-x1).toFixed(1)}" height="6" rx="3" fill="${riskCol(s.risk)}"/>`;acc+=s.km});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Elevation"><defs><linearGradient id="eg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--blue)" stop-opacity=".35"/><stop offset="1" stop-color="var(--blue)" stop-opacity="0"/></linearGradient></defs><path d="${line}L${sx(tot)} 80L${sx(0)} 80Z" fill="url(#eg)"/><path d="${line}" fill="none" stroke="var(--blue)" stroke-width="2.5" stroke-linejoin="round"/>${strip}<text x="10" y="12" font-size="11" fill="var(--mut)">120 m</text><text x="${W-10}" y="12" text-anchor="end" font-size="11" fill="var(--mut)">1,650 m</text></svg>`;
}
function stopDrive(silent){
  S.driving=false;cancelAnimationFrame(S.raf);
  const b=$('#drivebtn');if(b)b.innerHTML=`${ic('route',20)}<span>${t('start_drive')}</span>`;
}
function drive(){
  if(S.driving){stopDrive();updateRoute();return}
  const path=$('#rt-full'),veh=$('#veh');if(!path)return;
  const ch=chosen(),R=ROUTES[ch],ev=evalRoute(R,S.dep),L=path.getTotalLength();
  S.driving=true;$('#drivebtn').innerHTML=`${ic('x',20)}<span>${t('stop_drive')}</span>`;
  const t0=performance.now(),dur=11000;let lastSeg=-1;
  const cum=[];let a=0;ev.segs.forEach(s=>{a+=s.km;cum.push(a/ev.km)});
  const step=now=>{
    if(!S.driving)return;
    const p=Math.min(1,(now-t0)/dur),pt=path.getPointAtLength(L*p);
    veh.setAttribute('transform',`translate(${pt.x},${pt.y})`);
    const si=cum.findIndex(c=>p<=c);
    if(si!==lastSeg&&si>=0){lastSeg=si;if(ev.segs[si].risk>=.5)toast(t('al_rain',{s:ev.segs[si].n}))}
    const kmLeft=Math.round(ev.km*(1-p)),left=ev.total*(1-p);
    const pr=$('#rt-prog');if(pr)pr.textContent=`${kmLeft} ${t('km')} ${t('left')}, ${fmtD(left)}`;
    if(p<1)S.raf=requestAnimationFrame(step);else{S.driving=false;toast(t('arrived')+': Gangtok');const b=$('#drivebtn');if(b)b.innerHTML=`${ic('route',20)}<span>${t('start_drive')}</span>`}
  };
  S.raf=requestAnimationFrame(step);
}

function trackerPath(s){const a=[256,948],b=s.dest,mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2,dx=b[0]-a[0],dy=b[1]-a[1];const c=[mx-dy*.18,my+dx*.18];return {a,b,c}}
function bez(tp,tt){const u=1-tt;return [u*u*tp.a[0]+2*u*tt*tp.c[0]+tt*tt*tp.b[0],u*u*tp.a[1]+2*u*tt*tp.c[1]+tt*tt*tp.b[1]]}
function trackDyn(b,view){
  const s=STAYS.find(x=>x.id===b.ref),tp=trackerPath(s),p=b.track.prog,pos=bez(tp,p);
  const distKm=Math.hypot(tp.b[0]-tp.a[0],tp.b[1]-tp.a[1])*KM_PX*1.35,totMin=distKm/28*60,rem=Math.round(totMin*(1-p));
  const minx=Math.min(tp.a[0],tp.b[0],tp.c[0])-70,miny=Math.min(tp.a[1],tp.b[1],tp.c[1])-70,maxx=Math.max(tp.a[0],tp.b[0],tp.c[0])+70,maxy=Math.max(tp.a[1],tp.b[1],tp.c[1])+70;
  const map=`<div class="mapbox"><svg viewBox="${minx} ${miny} ${maxx-minx} ${maxy-miny}" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${baseMap()}<path d="M${tp.a.join(' ')}Q${tp.c.join(' ')} ${tp.b.join(' ')}" fill="none" stroke="var(--mut)" stroke-width="3.5" stroke-dasharray="6 7" stroke-linecap="round"/><path d="M${tp.a.join(' ')}Q${tp.c.join(' ')} ${tp.b.join(' ')}" fill="none" stroke="var(--blue)" stroke-width="5" stroke-linecap="round" pathLength="1" stroke-dasharray="${p.toFixed(3)} 2"/>${pinSVG(tp.b[0],tp.b[1],'var(--green)')}<g transform="translate(${pos[0].toFixed(1)},${pos[1].toFixed(1)})"><circle r="10" fill="var(--blue)" class="pulse" opacity=".5"/><circle r="7" fill="var(--blue)" stroke="#fff" stroke-width="3"/></g></svg></div>`;
  let txt;
  if(b.arrived)txt=`<span class="tag ok">${ic('check',13)}${b.checked?t('checked'):t('arrived')}</span>`;
  else if(b.track.on)txt=`<div class="row"><span class="tag warn">${ic('route',13)}${view==='host'?t('guest_way',{n:'Aarav'}):t('on_way')}</span><span class="sp"></span><span class="b">${t('arriving')} ${rem>=60?Math.floor(rem/60)+t('h')+' ':''}${rem%60}${t('m')}</span></div><div class="bar-prog"><i style="width:${Math.round(p*100)}%"></i></div>`;
  else txt=`<span class="mut sm">${view==='host'?t('no_guest'):''}</span>`;
  return map+`<div class="in" style="padding-bottom:0">${txt}</div>`;
}

/* Calls */
const SCRIPT=[['g','c1'],['u','c2'],['g','c3'],['u','c4'],['g','c5']];
function openCall(mode,who){
  endCall(true);
  const my=S.lang,other=mode==='tourist'?who.lang:'hi';
  S.call={mode,who,my,other,secs:0,timers:[],i:0};
  openOv(`<div class="callhead"><div class="avatar" style="background:${who.hue||'var(--ink)'};${who.hue?'':'color:var(--bg)'}">${who.name.split(' ').map(x=>x[0]).join('')}</div><div class="sp"><h3>${who.name}</h3><div class="sm mut" id="cstat">${t('ringing')}…</div></div><div class="wave" id="wave" hidden><i></i><i></i><i></i><i></i><i></i></div></div>
  <div class="row" style="margin-top:12px;flex-wrap:wrap"><span class="tag ok">${ic('globe',13)}${t('live_tr')}</span><span class="chip" style="min-height:32px;padding:0 10px">${LANGS[my]}</span>${ic('arrow',16)}<span class="chip" style="min-height:32px;padding:0 10px">${LANGS[other]}</span></div>
  <div class="caps" id="caps" aria-live="polite"></div>
  <div id="phr"></div>
  <button class="btn block" style="background:var(--sos);color:#fff;margin-top:8px" data-a="endcall">${ic('phone',20)}${t('end_call')}</button>`);
  const C=S.call,at=(ms,fn)=>C.timers.push(setTimeout(fn,ms));
  at(1400,()=>{$('#cstat').textContent=t('connected')+' 00:00';$('#wave').hidden=false;C.timers.push(setInterval(()=>{C.secs++;const e=$('#cstat');if(e)e.textContent=`${t('connected')} ${String(Math.floor(C.secs/60)).padStart(2,'0')}:${String(C.secs%60).padStart(2,'0')}`},1000))});
  SCRIPT.forEach(([by,k],i)=>at(2000+i*2800,()=>{const isMe=mode==='tourist'?by==='u':by==='g';addBubble(isMe,k)}));
  at(2000+SCRIPT.length*2800,()=>{if(mode==='tourist')showPhrases();else{const e=$('#wave');if(e)e.hidden=true}});
}
function addBubble(isMe,k){
  const C=S.call;if(!C)return;const caps=$('#caps');if(!caps)return;
  const pr=CALL[k][LI[C.my]],sc=CALL[k][LI[C.other]],same=C.my===C.other;
  const speakTxt=isMe?sc:pr,speakLang=isMe?C.other:C.my;
  caps.insertAdjacentHTML('beforeend',`<div class="bub ${isMe?'me':''}"><div class="pr">${pr}</div>${same?'':`<div class="sc"><span>${isMe?t('hears')+': ':''}${LANGS[C.other]}</span><span>${sc}</span></div>`}
  <div class="sc" style="margin-top:2px"><button data-a="speak" data-l="${speakLang}" data-x="${encodeURIComponent(speakTxt)}" aria-label="Play">${ic('volume',18)}</button></div></div>`);
  caps.scrollTop=caps.scrollHeight;
}
function showPhrases(){
  const box=$('#phr');if(!box)return;
  box.innerHTML=`<div class="mut sm" style="margin-bottom:6px">${t('tap_phrase')}</div><div class="chips">${['p1','p2','p3'].map((k,i)=>`<button class="chip" data-a="phrase" data-v="${i+1}">${CALL[k][LI[S.lang]]}</button>`).join('')}</div>`;
}
function endCall(silent){
  const C=S.call;if(!C)return;C.timers.forEach(x=>{clearTimeout(x);clearInterval(x)});S.call=null;

 trav:d=>{S.trav=Math.max(1,Math.min(8,S.trav+ +d.v));render(true)},
 upload:()=>{S.idOk=true;render(true)},
 apply:()=>{S.permit={stage:0};render();setTimeout(()=>{S.permit&&(S.permit.stage=1,S.tab==='permits'&&render(true))},1800);setTimeout(()=>{S.permit&&(S.permit.stage=2,S.tab==='permits'&&render(true))},3800)},
 resetpermit:()=>{S.permit=null;S.areas.clear();S.agency=null;S.idOk=false;render()},
 haccept:d=>setReq(d.v,'confirmed'),hdecline:d=>setReq(d.v,'declined'),
 checkin:d=>{const b=S.bookings.find(x=>x.id===d.v);b.checked=true;render(true);toast(t('checked'))},
 demoguest:()=>{let b=S.bookings.find(x=>x.type==='stay'&&x.status==='confirmed');if(!b){b={id:'b'+(++S.seq),type:'stay',ref:'pel',status:'confirmed',track:{on:true,prog:.35},arrived:false,checked:false};S.bookings.push(b)}else{b.track.on=true}render(true)},
 simcall:()=>openCall('host',{name:'Meera R.',hue:null}),
 callguest:()=>openCall('host',{name:'Aarav',hue:null})
};
function setReq(id,st){
  const sd=S.seeds.find(x=>x.id===id);
  if(sd){sd.status=st;if(st==='confirmed')S.earn+=sd.amt}
  else{const b=S.bookings.find(x=>x.id===id);if(b){b.status=st;const r=allReqs().find(x=>x.id===id);if(st==='confirmed'&&r)S.earn+=r.amt}}
  render(true);
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const f=A[el.dataset.a];if(f)f(el.dataset,el,e)});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.in==='dep'){S.dep=+el.value;updateRoute()}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.in==='lang'){S.lang=el.value;try{localStorage.setItem('ts_lang',S.lang)}catch(x){}const c=S.call;render(true);if(c){endCall(true);closeOv()}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!OV.hidden&&S.call)endCall()});
render();
</script>
</body>
</html>
